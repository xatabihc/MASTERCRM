plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mastercrm.offline'
    compileSdk 35

    defaultConfig {
        // This intentionally differs from the existing 0.9.4 package. Never replace
        // an installed version until its package name AND signing key are verified.
        applicationId 'com.mastercrm.offline.preview'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.8.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Stable release signing is deliberately opt-in: secrets are injected by
    // the local environment/GitHub encrypted Actions secrets, never committed.
    def signingPath = System.getenv('MASTERCRM_RELEASE_KEYSTORE')
    def signingStorePassword = System.getenv('MASTERCRM_RELEASE_STORE_PASSWORD')
    def signingAlias = System.getenv('MASTERCRM_RELEASE_KEY_ALIAS')
    def signingKeyPassword = System.getenv('MASTERCRM_RELEASE_KEY_PASSWORD')
    def hasReleaseSigning = [signingPath, signingStorePassword, signingAlias, signingKeyPassword]
            .every { it != null && !it.isEmpty() }

    signingConfigs {
        if (hasReleaseSigning) {
            mastercrmRelease {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.mastercrmRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
