plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mastercrm.offline'
    compileSdk 35

    defaultConfig {
        // This intentionally differs from the existing 0.9.4 package. Never replace
        // an installed version until its package name AND signing key are verified.
        applicationId 'com.mastercrm.offline.preview'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
