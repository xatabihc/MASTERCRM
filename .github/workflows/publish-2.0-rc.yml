name: Publish MasterCRM 2.0 RC
# This job never receives private signing keys. It downloads the existing
# verified signed artifact only after full Android, signature and upgrade gates.
on:
  workflow_run:
    workflows: ["Signed upgrade data-preservation test"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  candidate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GITHUB_REF_NAME: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install tools for APK identity verification
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Publish only if all three matching release gates passed
        run: bash tools/publish-2.0-release-candidate.sh
