name: Signed upgrade data-preservation test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/signed-upgrade.yml'
      - 'tools/test_signed_upgrade.py'

permissions:
  contents: read

concurrency:
  group: signed-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-upgrade:
    strategy:
      fail-fast: false
      matrix:
        baseline:
          - { name: '0.5', commit: '30e980640fcd92cf2a232ba8e35a530123c582b5' }
          - { name: '1.5', commit: 'c3c04e12b483c38902e2f7718db70da5fdef5e43' }
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare private signing key from encrypted GitHub Secrets
        shell: bash
        env:
          MASTERCRM_KEYSTORE_BASE64: ${{ secrets.MASTERCRM_KEYSTORE_BASE64 }}
          MASTERCRM_RELEASE_STORE_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_STORE_PASSWORD }}
          MASTERCRM_RELEASE_KEY_ALIAS: ${{ secrets.MASTERCRM_RELEASE_KEY_ALIAS }}
          MASTERCRM_RELEASE_KEY_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in MASTERCRM_KEYSTORE_BASE64 MASTERCRM_RELEASE_STORE_PASSWORD MASTERCRM_RELEASE_KEY_ALIAS MASTERCRM_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Missing private signing secret: $required"
              exit 1
            fi
          done
          WORK_DIR="$(mktemp -d)"
          chmod 700 "$WORK_DIR"
          printf '%s' "$MASTERCRM_KEYSTORE_BASE64" | base64 --decode > "$WORK_DIR/key.jks"
          chmod 600 "$WORK_DIR/key.jks"
          echo "MASTERCRM_RELEASE_KEYSTORE=$WORK_DIR/key.jks" >> "$GITHUB_ENV"
          echo "$WORK_DIR" > "$RUNNER_TEMP/mastercrm-signed-upgrade-secret-dir"
      - name: Build previously released signed ${{ matrix.baseline.name }} APK from immutable Git commit
        env:
          MASTERCRM_RELEASE_STORE_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_STORE_PASSWORD }}
          MASTERCRM_RELEASE_KEY_ALIAS: ${{ secrets.MASTERCRM_RELEASE_KEY_ALIAS }}
          MASTERCRM_RELEASE_KEY_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/mastercrm-baseline" ${{ matrix.baseline.commit }}
          (cd "$RUNNER_TEMP/mastercrm-baseline" && gradle --no-daemon :app:assembleRelease)
      - name: Build current signed APK
        env:
          MASTERCRM_RELEASE_STORE_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_STORE_PASSWORD }}
          MASTERCRM_RELEASE_KEY_ALIAS: ${{ secrets.MASTERCRM_RELEASE_KEY_ALIAS }}
          MASTERCRM_RELEASE_KEY_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify matching certificate, package ID and increasing version
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mastercrm-baseline/app/build/outputs/apk/release/app-release.apk"
          CURRENT="app/build/outputs/apk/release/app-release.apk"
          EXPECTED="8a0568717d5e5404c02d321ca6b4e9df830abba7ad0ca5cd4e799850e77e372f"
          declare -a VERSIONS
          for APK in "$BASE" "$CURRENT"; do
            test -s "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
            CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            [[ "$CERT" == "$EXPECTED" ]] || { echo "::error::Signing certificate mismatch"; exit 1; }
            BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            [[ "$BADGING" == *"package: name='com.mastercrm.offline.preview'"* ]] || exit 1
            VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
            [[ "$VERSION" =~ ^[0-9]+$ ]] || exit 1
            VERSIONS+=("$VERSION")
          done
          [[ "${VERSIONS[1]}" -gt "${VERSIONS[0]}" ]] || {
            echo "::error::New versionCode must exceed old versionCode"; exit 1;
          }
          echo "Signed baseline ${VERSIONS[0]} -> current ${VERSIONS[1]}"
      - name: Enable KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Install signed ${{ matrix.baseline.name }}, create a client, upgrade, and check data survived
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: python3 tools/test_signed_upgrade.py "$RUNNER_TEMP/mastercrm-baseline/app/build/outputs/apk/release/app-release.apk" "app/build/outputs/apk/release/app-release.apk"
      - name: Upload synthetic upgrade screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastercrm-signed-upgrade-screenshots-from-${{ matrix.baseline.name }}
          path: |
            mastercrm-upgrade-before.png
            mastercrm-upgrade-after.png
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mastercrm-signed-upgrade-secret-dir" ]]; then
            SECRET_DIR="$(cat "$RUNNER_TEMP/mastercrm-signed-upgrade-secret-dir")"
            rm -rf -- "$SECRET_DIR"
            rm -f "$RUNNER_TEMP/mastercrm-signed-upgrade-secret-dir"
          fi
