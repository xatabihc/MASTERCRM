name: Signed preview APK
# After the first successful manual signing, releases are automatic on main.
# No secrets are exposed to pull_request builds or untrusted branches.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/signed-preview.yml'

permissions:
  contents: read

jobs:
  signed-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Securely prepare signing material
        shell: bash
        env:
          MASTERCRM_KEYSTORE_BASE64: ${{ secrets.MASTERCRM_KEYSTORE_BASE64 }}
          MASTERCRM_RELEASE_STORE_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_STORE_PASSWORD }}
          MASTERCRM_RELEASE_KEY_ALIAS: ${{ secrets.MASTERCRM_RELEASE_KEY_ALIAS }}
          MASTERCRM_RELEASE_KEY_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in MASTERCRM_KEYSTORE_BASE64 MASTERCRM_RELEASE_STORE_PASSWORD MASTERCRM_RELEASE_KEY_ALIAS MASTERCRM_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Missing GitHub Actions secret: $required. No APK produced."
              exit 1
            fi
          done
          SIGNING_DIRECTORY="$(mktemp -d)"
          chmod 700 "$SIGNING_DIRECTORY"
          trap 'rm -rf "$SIGNING_DIRECTORY"' ERR
          printf '%s' "$MASTERCRM_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIRECTORY/signing.jks"
          chmod 600 "$SIGNING_DIRECTORY/signing.jks"
          test -s "$SIGNING_DIRECTORY/signing.jks"
          echo "MASTERCRM_RELEASE_KEYSTORE=$SIGNING_DIRECTORY/signing.jks" >> "$GITHUB_ENV"
          echo "$SIGNING_DIRECTORY" > "$RUNNER_TEMP/mastercrm-signing-path"
      - name: Run unit tests and produce signed APK
        env:
          MASTERCRM_RELEASE_STORE_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_STORE_PASSWORD }}
          MASTERCRM_RELEASE_KEY_ALIAS: ${{ secrets.MASTERCRM_RELEASE_KEY_ALIAS }}
          MASTERCRM_RELEASE_KEY_PASSWORD: ${{ secrets.MASTERCRM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signed package, certificate and offline permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          # Pin the actual certificate used for the first signed v0.5 release.
          # A changed key would prevent updates and can strand users' local data.
          EXPECTED_SHA256="8a0568717d5e5404c02d321ca6b4e9df830abba7ad0ca5cd4e799850e77e372f"
          ACTUAL_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Signing certificate changed; refusing to publish incompatible update."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.mastercrm.offline.preview'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.INTERNET'; then
            echo "::error::Signed preview APK requested INTERNET permission"
            exit 1
          fi
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mastercrm-preview-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mastercrm-signing-path" ]]; then
            SIGNING_DIRECTORY="$(cat "$RUNNER_TEMP/mastercrm-signing-path")"
            rm -rf -- "$SIGNING_DIRECTORY"
            rm -f "$RUNNER_TEMP/mastercrm-signing-path"
          fi
