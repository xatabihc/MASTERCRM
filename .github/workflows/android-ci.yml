name: Android offline preview
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Validate maintenance and upgrade-check scripts
        run: |
          python3 -m py_compile tools/test_signed_upgrade.py
          bash -n tools/run-android-ui-ci.sh
          bash -n tools/audit-local-mastercrm.sh
      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Build debug APK and validate unsigned release variant
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify preview identity, offline permissions and APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.mastercrm.offline.preview'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission" >&2
            exit 1
          fi
          test -s "$APK"
      - name: Upload non-production preview APK
        uses: actions/upload-artifact@v4
        with:
          name: mastercrm-offline-preview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  instrumentation:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Enable KVM hardware acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run real SQLite integration tests on fresh Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: bash tools/run-android-ui-ci.sh
      - name: Save emulator screenshot for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastercrm-android-ui-screenshot-api-${{ matrix.api }}
          path: mastercrm-emulator-overview.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastercrm-android-ui-test-results-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
