name: Android offline preview
on:
  push:
    branches: [ main, 'develop/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Build preview APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload non-production preview APK
        uses: actions/upload-artifact@v4
        with:
          name: mastercrm-offline-preview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
