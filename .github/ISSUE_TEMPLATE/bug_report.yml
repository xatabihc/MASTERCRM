name: Ошибка MasterCRM
description: Сообщить о воспроизводимой ошибке без личных данных клиентов
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за проверку MasterCRM Offline. **Не прикладывайте базы клиентов, .mcrm5-файлы, пароли, фото клиентов, телефоны, адреса, ключи подписи или неотредактированные скриншоты.**
        Для проверки создайте тестового клиента с вымышленными данными.
  - type: input
    id: appversion
    attributes:
      label: Версия приложения
      placeholder: "1.6.0 Beta"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и Android
      placeholder: "Samsung A07, Android 16"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Раздел
      options:
        - Клиенты
        - Заказы / поиск / статусы
        - Платежи / расходы / графики
        - Фотографии
        - Резервные копии
        - PDF
        - Интерфейс / доступность
        - Установка / обновление
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Используйте только вымышленные данные
      placeholder: "1. Открыть ... 2. Нажать ... 3. Получить ошибку ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Конфиденциальность
      options:
        - label: В описании и вложениях нет личных данных клиентов, секретов или резервных копий
          required: true
